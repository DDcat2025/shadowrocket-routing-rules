name: Build and validate rules
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh upstream snapshots
        type: boolean
        default: false
  schedule:
    - cron: '47 5 * * 1'
permissions:
  contents: read
concurrency:
  group: routing-rules-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/build_rules.py --check
      - run: python3 scripts/check_routes.py
  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh pinned input files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_sources.py
      - run: python3 scripts/refresh_dedicated_sources.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 scripts/build_rules.py
      - run: python3 scripts/check_routes.py
      - run: python3 scripts/build_rules.py --check
      - name: Commit validated updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data rule docs
          git commit -m 'Refresh verified routing sources'
          git push
